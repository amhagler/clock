<script>

  const stopper=setInterval(()=>{},999999);for(let i=1;i<=stopper;i++)clearInterval(i);
  const S={mode:'duration',running:false,total:0,elapsed:0,left:0,target:null,anchor:0,elapsedBase:0,extra:false,extraPromoted:false,muted:false,hero:'remaining',digital:true,fired:new Set(),extraFired:new Set(),previousExtra:0};let promotionTimer=0;

  const play=a=>{if(S.muted)return;a.pause();a.currentTime=0;a.play().catch(()=>{})};
  const nums=[...document.querySelectorAll('.num')],hourHand=$('hh'),minuteHand=$('mh'),secondHand=$('sh');
  const extraHour=document.createElement('i'),extraMinute=document.createElement('i');extraHour.className='hand hour extraHand';extraMinute.className='hand minute extraHand';$('face').insertBefore(extraHour,$('sh'));$('face').insertBefore(extraMinute,$('sh'));extraHour.hidden=extraMinute.hidden=true;
  const headerActions=document.createElement('div');headerActions.style.display='flex';headerActions.style.gap='8px';const oldFull=document.querySelector('.full');oldFull.parentNode.insertBefore(headerActions,oldFull);headerActions.appendChild(oldFull);const sound=document.createElement('button');sound.className='soundMaster';sound.textContent='🔊';sound.title='Mute all sound effects';headerActions.insertBefore(sound,oldFull);sound.onclick=()=>{S.muted=!S.muted;sound.textContent=S.muted?'🔇':'🔊';if(S.muted){bowl.pause();bells.pause()}};
  const setTimer=document.createElement('button');setTimer.className='setTimer';setTimer.textContent='Set timer';$('app').appendChild(setTimer);const extraToggle=document.createElement('button');extraToggle.className='extraToggle';extraToggle.textContent='+50% hands';$('console').insertBefore(extraToggle,document.querySelector('.actions'));extraToggle.hidden=true;

  const metricEls=[...document.querySelectorAll('.metric')],metricIds=['current','elapsed','remaining','zero'];

  const showSetup=()=>{$('console').style.display='flex';$('console').classList.remove('compact');$('setup').style.display='contents';setTimer.hidden=true};setTimer.onclick=showSetup;

  function start(){const now=new Date();let duration,finish;if(S.mode==='duration'){duration=(+$('hours').value*3600 + +$('minutes').value*60 + +$('seconds').value)*1000;finish=new Date(now.getTime()+duration)}else{if(!$('endTime').value)return;finish=new Date(`${now.toISOString().slice(0,10)}T${$('endTime').value}`);if(finish<=now)finish.setDate(finish.getDate()+1);duration=finish-now}if(duration<=0)return;Object.assign(S,{running:true,total:duration,elapsed:0,left:duration,target:finish,anchor:Date.now(),elapsedBase:0,hero:'remaining',digital:true,extraPromoted:false});clearTimeout(promotionTimer);S.fired.clear();S.extraFired.clear();S.previousExtra=0;setFace(true);$('dialLabel').textContent='TIME REMAINING';secondHand.hidden=true;hourHand.hidden=duration<=3600000;extraToggle.hidden=false;$('setup').style.display='none';$('console').classList.add('compact');$('start').hidden=true;$('pause').hidden=false;$('digitalBox').hidden=false;$('stage').classList.remove('idle');setTimer.hidden=true;setTimeout(()=>play(bowl),1000)}$('start').onclick=start;
  $('pause').onclick=()=>{const limit=S.extra?S.total*1.5:S.total;if(S.elapsed>=limit)return;if(S.running){S.elapsedBase=S.elapsed;S.running=false;$('pause').textContent='Resume'}else{S.anchor=Date.now();S.running=true;$('pause').textContent='Pause'}};
  function resetAll(){Object.assign(S,{running:false,total:0,elapsed:0,left:0,target:null,extra:false,extraPromoted:false,digital:true});clearTimeout(promotionTimer);S.fired.clear();S.extraFired.clear();S.previousExtra=0;setFace(false);secondHand.hidden=false;hourHand.hidden=false;extraHour.hidden=extraMinute.hidden=true;extraToggle.hidden=true;extraToggle.classList.remove('active');$('digitalBox').hidden=true;$('stage').classList.add('idle');$('console').style.display='none';$('setup').style.display='contents';$('start').hidden=false;$('pause').hidden=true;$('app').classList.remove('finished');$('dialLabel').textContent='LOCAL TIME';setTimer.hidden=false;$('showDigitalEnh')?.setAttribute('hidden','')}$('reset').onclick=resetAll;

  function render(){const now=new Date();if(S.target&&S.running)S.elapsed=Math.max(0,S.elapsedBase+Date.now()-S.anchor);if(S.target){S.left=Math.max(0,S.total-S.elapsed);[30,20,10,5].forEach(m=>{if(S.left<m*60000&&!S.fired.has(m)&&S.total>=m*60000){S.fired.add(m);announce(m+' minutes remaining')}});if(S.left<=0&&!S.fired.has(0)){S.fired.add(0);play(bowl);$('app').classList.add('finished');if(S.extra){announce('Standard time complete',15000,false);clearTimeout(promotionTimer);promotionTimer=setTimeout(()=>{$('app').classList.remove('finished');S.previousExtra=Math.max(0,S.total*1.5-S.elapsed);S.extraPromoted=true;S.hero='remaining';metricEls.forEach((m,j)=>m.classList.toggle('active',j===2))},15000)}}const extraLeft=Math.max(0,S.total*1.5-S.elapsed),limit=S.extra?S.total*1.5:S.total;if(S.extra&&S.extraPromoted){[30,20,10,5].forEach(m=>{const threshold=m*60000;if(S.previousExtra>=threshold&&extraLeft<threshold&&!S.extraFired.has(m)){S.extraFired.add(m);announce(m+' minutes remaining')}});S.previousExtra=extraLeft;if(extraLeft<=0&&!S.extraFired.has(0)){S.extraFired.add(0);play(bowl);$('app').classList.add('finished');announce('Extra time complete',15000,false);clearTimeout(promotionTimer);promotionTimer=setTimeout(()=>$('app').classList.remove('finished'),15000)}}if(S.elapsed>=limit)S.running=false;minuteHand.style.transform=`rotate(${S.left/60000*6}deg)`;hourHand.style.transform=`rotate(${S.left/3600000*30}deg)`;extraMinute.style.transform=`rotate(${extraLeft/60000*6}deg)`;extraHour.style.transform=`rotate(${extraLeft/3600000*30}deg)`;const extraPrimary=S.extra&&S.extraPromoted&&S.hero==='remaining',shownLeft=extraPrimary?extraLeft:S.left;const values={current:wall(now),elapsed:fmt(S.elapsed),remaining:remainText(shownLeft),zero:wall(S.target)};$('current').textContent=values.current;$('elapsed').textContent=values.elapsed;$('remaining').textContent=remainText(S.left);$('zero').textContent=values.zero;const d=$('digital');if(S.hero==='remaining'&&shownLeft>300000){d.c
